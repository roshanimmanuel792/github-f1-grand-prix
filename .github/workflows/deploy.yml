name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main] # tests + build only; nothing is deployed from a PR
  workflow_dispatch:
  workflow_run:
    workflows: ['Update contributions']
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # After a data update, only deploy if that run succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit + integration tests (game, physics, replay, export, worker API, OAuth)
        run: npm test

      - name: Validate contribution data
        run: npm run validate

      # WebGL runs on SwiftShader in CI; ffprobe independently validates exported GIF/MP4 files.
      - name: Browser tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npx playwright install --with-deps chromium
          npx playwright test --reporter=line

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

      - name: Production build
        run: npm run build

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
