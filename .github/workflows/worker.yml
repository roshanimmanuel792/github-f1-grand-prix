name: Deploy contributions API (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**', 'src/data/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Worker + data tests
        run: npx vitest run tests/worker.test.js tests/contributions.test.js tests/loader.test.js

      # Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
      # Without them the job stops here instead of failing.
      - name: Check Cloudflare credentials
        id: creds
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CF_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN not set; skipping deploy."; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci
          npx wrangler deploy

      - name: Smoke test
        if: steps.creds.outputs.ok == 'true' && vars.API_BASE_URL != ''
        run: curl -fsS "${{ vars.API_BASE_URL }}/api/health"
